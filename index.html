
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abrir AdsFy</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    button {
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    p {
      margin-top: 14px;
      font-size: 14px;
      color: #333333;
    }

    strong {
      color: #3B82F6;
    }
  </style>
</head>

<body>

  <button id="abrir">ABRIR APLICATIVO</button>

  <p>
    Selecione <strong>OPEN</strong> para abrir o AdsFy
  </p>

  <script>
    document.getElementById("abrir").addEventListener("click", function () {
      const destino = "https://adsfy.it/app";
      const link = "instagram://extbrowser/?url=" + encodeURIComponent(destino);

      window.location.href = link;
    });
  </script>

</body>
</html>
