
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abrir AdsFy</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px 24px 18vh;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #ffffff;
    }

    .logo {
      display: block;
      width: 170px;
      max-width: 60%;
      height: auto;
      margin: 0 auto 32px;
    }

    button {
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 16px 32px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    p {
      margin: 14px 0 0;
      font-size: 17px;
      font-weight: 300;
      line-height: 1.3;
      color: #111111;
      text-align: center;
    }

    strong {
      font-size: 1.2em;
      font-weight: 800;
      color: #3F4FFF;
    }

    /* Estado: modal do Instagram aberto */
    .logo, button, p {
      transition: opacity 0.2s ease;
    }

    body.aberto .logo,
    body.aberto button {
      display: none !important;
    }

    body.aberto p {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(48px + env(safe-area-inset-bottom, 0px));
      margin: 0;
      padding: 0 24px;
      box-sizing: border-box;
    }
  </style>
</head>

  <button id="abrir">ABRIR APLICATIVO</button>

  <p>
    Selecione <strong>Open</strong> para abrir o AdsFy
  </p>

  <script>
    var aberto = false;
    var inicio = 0;

    function restaurar() {
      // ignora eventos que disparam junto com a abertura do modal
      if (!aberto || Date.now() - inicio < 500) return;
      aberto = false;
      document.body.classList.remove("aberto");
    }

    document.getElementById("abrir").addEventListener("click", function () {
      const destino = "https://adsfy.it/app";
      const link = "instagram://extbrowser/?url=" + encodeURIComponent(destino);

      aberto = true;
      inicio = Date.now();
      document.body.classList.add("aberto");

      window.location.href = link;
    });

    // Modal fechado (Cancel) ou volta para a página: tudo volta ao normal
    window.addEventListener("focus", restaurar);
    window.addEventListener("pageshow", restaurar);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) restaurar();
    });
    document.addEventListener("touchstart", restaurar, { passive: true });
    document.addEventListener("click", restaurar);
  </script>
