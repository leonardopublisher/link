
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acessar Adsfy</title>

<style>
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 70px 20px;
}

button {
  background: #25d366;
  color: black;
  padding: 18px 30px;
  border: 0;
  border-radius: 12px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<h2>Acesse o Adsfy</h2>

<p id="status">
Clique abaixo para continuar.
</p>

<button id="primeiro">
ABRIR ADSFY
</button>

<script>
document.getElementById("primeiro")
.addEventListener("click", function() {

  var destino = "https://adsfy.it/app";

  var comando =
    "instagram://extbrowser/?url=" +
    encodeURIComponent(destino);

  document.getElementById("status").innerText =
    "Abrindo navegador externo...";

  // Executa o comando após o primeiro clique.
  window.location.href = comando;

});
</script>

</body>
</html>
